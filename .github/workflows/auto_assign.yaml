name: Auto Assign Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-assign:
    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      # 🔥 STEP PALING PENTING
      - name: Generate env.yaml
        run: |
          echo "${APP_PRIVATE_KEY}" > /tmp/github-app-private-key.pem
          printf 'github:\n  app_id: %s\n  private_key_path: /tmp/github-app-private-key.pem\n' "${APP_ID}" > env.yaml

      - name: Run auto assign
        run: go run ./cmd/main.go