name: Auto Assign Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-assign:
    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      # 🔥 Generate config file from secrets
      - name: Generate env.yaml
        run: |
          echo "github:" > env.yaml
          echo "  app_id: ${APP_ID}" >> env.yaml
          echo "  private_key: |-" >> env.yaml
          printf "%b" "${APP_PRIVATE_KEY}" | sed 's/^/    /' >> env.yaml

      # 🔍 Debug (optional – bisa dihapus nanti)
      - name: Debug env.yaml (safe)
        run: |
          echo "env.yaml generated"
          echo "app_id present: ${APP_ID:+yes}"
          echo "private_key length: ${#APP_PRIVATE_KEY}"

      # 🚀 Run main app
      - name: Run auto assign
        run: go run ./cmd/main.go