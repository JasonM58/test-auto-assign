name: Auto Assign Reviewer

on:
  pull_request:
    types: [opened, reopened]

jobs:
  auto-assign:
    runs-on: self-hosted

    env:
      PROMETHEUS_URL: http://vm-cluster-vmauth.monitoring.svc.cluster.local:8427/select/0/prometheus
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
      LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
      LARK_BOT_SECRET: ${{ secrets.LARK_BOT_SECRET }}
      LARK_GITHUB_EMAIL_MAP: ${{ secrets.LARK_GITHUB_EMAIL_MAP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Generate env.yaml
        run: |
          echo "github:" > env.yaml
          echo "  app_id: ${APP_ID}" >> env.yaml
          echo "  private_key: |-" >> env.yaml
          printf "%b\n" "${APP_PRIVATE_KEY}" | sed 's/^/    /' >> env.yaml
          echo "" >> env.yaml

          echo "lark:" >> env.yaml
          echo "  app_id: ${LARK_APP_ID}" >> env.yaml
          echo "  app_secret: ${LARK_APP_SECRET}" >> env.yaml
          echo "  github_to_email_map: ${LARK_GITHUB_EMAIL_MAP}" >> env.yaml
          echo "  secret: ${LARK_BOT_SECRET}" >> env.yaml
          echo "  webhook_url: ${LARK_WEBHOOK_URL}" >> env.yaml
          echo "" >> env.yaml
          echo "prometheus:" >> env.yaml
          echo "  base_url: \"${PROMETHEUS_URL}\"" >> env.yaml
          echo "  query_timeout_secs: 10" >> env.yaml
          echo "  max_retries: 3" >> env.yaml
          echo "  retry_base_delay_ms: 500" >> env.yaml

      - name: Run auto assign
        run: go run ./cmd/main.go