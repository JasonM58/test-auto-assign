name: Auto Assign Reviewer

on:
    pull_request:
        types: [opened, synchronize]

jobs:
    auto-assign:
        runs-on: ubuntu-latests
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                go-version: '1.22'

            - name: Run auto assign
              run: go run ./cmd/main.go

